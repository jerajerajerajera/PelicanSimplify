# Deletes branches that are no longer needed, such as branches of merged pull requests.
# Run it by hand under Actions; main, beta and snapshot (the update channels) are never deleted.
name: Delete branches
on:
  workflow_dispatch:
    inputs:
      branches:
        description: Branch names, separated by spaces
        required: true
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCHES: ${{ inputs.branches }}
        run: |
          for branch in $BRANCHES; do
            case "$branch" in main|beta|snapshot) echo "Keeping $branch"; continue;; esac
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" && echo "Deleted $branch"
          done
